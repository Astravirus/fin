<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" name="viewport"/>
<title>Finance Tracker — Ввод и история</title>
<link href="apple-touch-icon.png" rel="apple-touch-icon"/>
<link href="icon-192.png" rel="icon" type="image/png"/>
<link href="manifest.webmanifest" rel="manifest"/>
<style>
:root{
  --bg:#0b0d10;
  --panel:#141820;
  --panel-2:#1c212c;
  --line:#262f3f;
  --text:#f3f2ef;
  --muted:#8c96a8;
  --amber:#f0b459;
  --amber-soft:rgba(240, 180, 89, 0.15);
  --gold:#d4af37;
  --green:#72c184;
  --red:#e37368;
  --radius:14px;
}
*{box-sizing:border-box;}
@keyframes fadeIn {
  from { opacity: 0; transform: translateY(8px); }
  to { opacity: 1; transform: translateY(0); }
}
body{
  margin:0;
  background:radial-gradient(1200px 800px at 20% -10%, #171f2e 0%, var(--bg) 70%);
  color:var(--text);
  font-family:-apple-system, BlinkMacSystemFont, 'SF Pro Text', 'SF Pro Icons', 'Helvetica Neue', Helvetica, Arial, sans-serif;
  padding:20px 16px 110px;
  min-height:100vh;
  animation: fadeIn 0.35s cubic-bezier(0.16, 1, 0.3, 1) forwards;
  -webkit-font-smoothing: antialiased;
}
.wrap{max-width:880px;margin:0 auto;}
header{margin-bottom:18px;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:10px;padding:0 4px;}
h1{font-size:1.5rem;margin:0;font-weight:700;letter-spacing:-0.01em;color:var(--text);}
.sub{color:var(--muted);font-size:0.82rem;margin-top:3px;}

.card{
  background:var(--panel);
  border:1px solid var(--line);
  border-radius:var(--radius);
  padding:16px;
  margin-bottom:16px;
  box-shadow: 0 4px 24px rgba(0,0,0,0.25);
  transition: transform 0.2s ease;
}
.card-title{font-size:0.78rem;text-transform:uppercase;letter-spacing:0.06em;color:var(--muted);margin-bottom:12px;font-weight:700;}

form{
  background:var(--panel);
  border:1px solid var(--line);
  border-radius:var(--radius);
  padding:18px;
  margin-bottom:20px;
  box-shadow: 0 4px 24px rgba(0,0,0,0.25);
}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px 14px;align-items:start;}
.grid > div{min-width:0;}
.grid input,.grid select{min-width:0;max-width:100%;width:100%;}
label{display:block;font-size:0.75rem;color:var(--muted);margin-bottom:5px;font-weight:600;}
input,select{
  width:100%;
  background:var(--panel-2);
  border:1px solid var(--line);
  border-radius:10px;
  color:var(--text);
  padding:11px 12px;
  font-size:0.92rem;
  outline:none;
  transition:border-color 0.2s, box-shadow 0.2s;
}
input:focus,select:focus{
  border-color:var(--amber);
  box-shadow: 0 0 0 3px rgba(240, 180, 89, 0.2);
}

.type-toggle{display:flex;gap:8px;margin-bottom:14px;}
.type-toggle button{
  flex:1;
  padding:10px;
  border-radius:10px;
  border:1px solid var(--line);
  background:var(--panel-2);
  color:var(--muted);
  cursor:pointer;
  font-size:0.88rem;
  font-weight:600;
  transition: all 0.2s;
}
.type-toggle button.active[data-type="expense"]{background:rgba(227, 115, 104, 0.2);border-color:var(--red);color:var(--red);}
.type-toggle button.active[data-type="income"]{background:rgba(114, 193, 132, 0.2);border-color:var(--green);color:var(--green);}

.submit-row{margin-top:16px;display:flex;gap:10px;align-items:center;}
.btn-add{
  background:var(--amber);
  color:#111;
  border:none;
  padding:12px 22px;
  border-radius:10px;
  font-weight:700;
  cursor:pointer;
  font-size:0.92rem;
  box-shadow: 0 4px 14px rgba(240, 180, 89, 0.3);
  transition: transform 0.1s, filter 0.2s;
}
.btn-add:active{transform:scale(0.97);}
.btn-add:hover{filter:brightness(1.08);}
.hint{font-size:0.75rem;color:var(--muted);}

/* RESPONSIVE TABLE FIX */
.table-container {
  width: 100%;
  overflow-x: auto;
  -webkit-overflow-scrolling: touch;
  border-radius: 10px;
  border: 1px solid var(--line);
  background: var(--panel);
}
table{width:100%;border-collapse:collapse;min-width:540px;}
thead th{
  text-align:left;
  font-size:0.72rem;
  text-transform:uppercase;
  letter-spacing:0.05em;
  color:var(--muted);
  padding:12px 14px;
  border-bottom:1px solid var(--line);
  background:var(--panel-2);
  font-weight:700;
}
tbody td{
  padding:12px 14px;
  font-size:0.88rem;
  border-bottom:1px solid var(--line);
}
tbody tr:last-child td{border-bottom:none;}
tbody tr:hover{background:rgba(255,255,255,0.02);}
.amt-expense{color:var(--red);font-weight:600;}
.amt-income{color:var(--green);font-weight:600;}
.cb{color:var(--amber);font-size:0.82rem;}
.empty{text-align:center;padding:35px;color:var(--muted);font-size:0.88rem;}
.bank-tag{
  font-size:0.72rem;
  padding:3px 9px;
  border-radius:20px;
  border:1px solid var(--line);
  color:var(--muted);
  background:var(--panel-2);
  font-weight:600;
}

.bank-chip,.cat-chip{
  background:var(--panel-2);
  border:1px solid var(--line);
  border-radius:18px;
  padding:6px 12px;
  font-size:0.78rem;
  color:var(--muted);
  cursor:pointer;
  display:inline-block;
  margin:3px;
  font-weight:600;
  transition: all 0.15s;
}
.bank-chip.active,.cat-chip.active{
  background:var(--amber-soft);
  border-color:var(--amber);
  color:var(--amber);
}

.toast{
  position:fixed;
  left:50%;
  transform:translateX(-50%);
  bottom:95px;
  background:rgba(28, 33, 44, 0.95);
  backdrop-filter: blur(12px);
  border:1px solid var(--line);
  color:var(--text);
  padding:11px 18px;
  border-radius:12px;
  font-size:0.85rem;
  font-weight:600;
  box-shadow: 0 10px 30px rgba(0,0,0,0.5);
  z-index:1100;
  animation: fadeIn 0.2s ease-out;
}
.toast[hidden]{display:none;}

.history-controls{display:flex;gap:8px;margin-bottom:14px;flex-wrap:wrap;}
.history-controls input{flex:1 1 180px;}
.history-controls select{flex:0 0 auto;width:auto;}

.ios-bank-bar{
  display:flex;
  align-items:center;
  gap:8px;
  overflow-x:auto;
  padding:4px 0 10px;
  margin-bottom:14px;
  scrollbar-width:none;
  -webkit-overflow-scrolling:touch;
}
.ios-bank-bar::-webkit-scrollbar{display:none;}
.ios-bank-pill{
  flex:0 0 auto;
  display:inline-flex;
  align-items:center;
  gap:6px;
  background:var(--panel);
  border:1px solid var(--line);
  border-radius:20px;
  padding:6px 12px;
  font-size:0.78rem;
  color:var(--text);
  text-decoration:none;
  cursor:pointer;
  font-weight:600;
  box-shadow: 0 2px 8px rgba(0,0,0,0.2);
  transition: transform 0.1s;
}
.ios-bank-pill:active{transform:scale(0.96);}
.ios-bank-pill .dot{width:8px;height:8px;border-radius:50%;display:inline-block;}

.summary{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px;margin-bottom:20px;}
.summary-card{
  background:var(--panel);
  border:1px solid var(--line);
  border-radius:var(--radius);
  padding:14px;
  box-shadow: 0 4px 20px rgba(0,0,0,0.2);
}
.summary-card .label{font-size:0.72rem;color:var(--muted);text-transform:uppercase;margin-bottom:5px;font-weight:700;}
.summary-card .value{font-size:1.25rem;font-weight:700;}
.summary-card.income .value{color:var(--green);}
.summary-card.expense .value{color:var(--red);}
.summary-card.cashback .value{color:var(--amber);}
.summary-card.balance .value{color:var(--gold);}

/* ===== iOS NATIVE TAB BAR (BOTTOM FIXED) ===== */
.ios-tab-bar{
  position:fixed;
  bottom:0;
  left:0;
  right:0;
  height:85px;
  background:rgba(18, 22, 30, 0.88);
  backdrop-filter: blur(25px);
  -webkit-backdrop-filter: blur(25px);
  border-top:1px solid rgba(42, 48, 60, 0.6);
  display:flex;
  justify-content:space-around;
  align-items:flex-start;
  padding-top:8px;
  z-index:1000;
  box-shadow: 0 -6px 30px rgba(0,0,0,0.5);
}
.ios-tab-item{
  flex:1;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  color:var(--muted);
  text-decoration:none;
  font-size:0.7rem;
  font-weight:600;
  letter-spacing:0.01em;
  transition: color 0.2s, transform 0.1s;
  padding:4px 0;
  -webkit-tap-highlight-color:transparent;
}
.ios-tab-item:active{transform:scale(0.92);}
.ios-tab-item .tab-icon{
  font-size:1.45rem;
  margin-bottom:3px;
  line-height:1;
}
.ios-tab-item.active{
  color:var(--amber);
}
body{
  padding-bottom:110px !important;
}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div>
      <h1>Finance Tracker</h1>
      <div class="sub">Ввод и история операций</div>
    </div>
  </header>

  <div class="ios-bank-bar" id="iosBankBar"></div>

  <form id="entryForm">
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;gap:8px;flex-wrap:wrap;">
      <div class="card-title" style="margin-bottom:0;">Новая запись</div>
      <button type="button" id="saveAsTplBtn" style="background:var(--panel-2);color:var(--amber);border:1px solid var(--line);border-radius:8px;padding:5px 12px;font-size:0.75rem;cursor:pointer;font-weight:600;">⚡ Шаблон</button>
    </div>
    <div style="background:var(--panel-2);border:1px solid var(--line);border-radius:10px;padding:12px;margin-bottom:14px;">
      <div style="display:flex;gap:8px;align-items:center;">
        <input type="text" id="smartQuickInput" placeholder="⚡ Быстрый ввод: Кофе 250 Т-Банк" autocomplete="off"/>
        <button type="button" class="btn-add" id="smartQuickBtn" style="padding:9px 16px;font-size:0.85rem;">Внести</button>
      </div>
      <div id="tplChipsWrap" style="display:flex;flex-wrap:wrap;gap:6px;margin-top:8px;"></div>
    </div>

    <div class="type-toggle">
      <button class="active" data-type="expense" type="button">Расход</button>
      <button data-type="income" type="button">Доход</button>
    </div>

    <div class="grid">
      <div>
        <label>Дата</label>
        <div style="position:relative;"><input id="f-date-text" type="text" readonly tabindex="-1" placeholder="—"/><input id="f-date" required="" type="date" style="position:absolute;top:0;left:0;width:100%;height:100%;opacity:0;cursor:pointer;"/></div>
      </div>
      <div>
        <label id="descLabel">Описание</label>
        <input id="f-desc" placeholder="Что купил" required="" type="text"/>
      </div>
      <div>
        <label>Сумма, ₽</label>
        <input id="f-amount" inputmode="decimal" placeholder="0" required="" type="text"/>
      </div>
      <div>
        <label id="bankLabel">Банк</label>
        <input autocomplete="off" id="f-bank" list="bankSuggestions" placeholder="Название банка" type="text"/>
        <datalist id="bankSuggestions"></datalist>
        <div id="bankChips" style="margin-top:6px;"></div>
      </div>
      <div id="cashbackField">
        <label style="display:flex;align-items:center;justify-content:space-between;"><span>Кешбек, ₽</span><span id="autoCbBadge" style="font-size:0.7rem;color:var(--amber);background:var(--amber-soft);padding:2px 7px;border-radius:8px;cursor:pointer;">авто: 0%</span></label>
        <input id="f-cashback" inputmode="decimal" placeholder="0" type="text"/>
      </div>
      <div id="categoryField">
        <label>Категория</label>
        <select id="f-category">
          <option value="Продукты">🛒 Продукты</option>
          <option value="Фастфуд">🍔 Фастфуд</option>
          <option value="Доставка">📦 Доставка</option>
          <option value="Транспорт">🚌 Транспорт</option>
          <option value="Ж/д билеты">🚃 Ж/д билеты</option>
          <option value="Работа">💼 Работа</option>
          <option value="Ежемесячные">🏠 Ежемесячные</option>
          <option value="Здоровье">❤️‍🩹 Здоровье</option>
          <option value="Красота">💅 Красота</option>
          <option value="Одежда">👕 Одежда</option>
          <option value="Электроника">⚡️ Электроника</option>
          <option value="Товары для дома">🧹 Товары для дома</option>
          <option value="Другое">🎲 Другое</option>
          <option value="Развлечения">👾 Развлечения</option>
          <option value="Цветы">💐 Цветы</option>
        </select>
      </div>
    </div>
    <div class="submit-row">
      <button class="btn-add" type="submit">Добавить</button>
      <span class="hint" id="formHint"></span>
    </div>
  </form>

  <div class="card">
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;flex-wrap:wrap;gap:8px;">
      <div class="card-title" style="margin-bottom:0;">📜 История операций</div>
      <span id="historyFilterCount" style="font-size:0.75rem;color:var(--muted);font-weight:600;"></span>
    </div>
    <div class="history-controls">
      <input type="search" id="historySearch" placeholder="🔍 Поиск по описанию, сумме..."/>
      <select id="historyBankFilter"><option value="">Все банки</option></select>
      <select id="historyCatFilter"><option value="">Все категории</option></select>
    </div>
    <div class="table-container">
      <table>
        <thead>
          <tr>
            <th>Дата</th>
            <th>Описание</th>
            <th>Категория</th>
            <th>Банк</th>
            <th>Сумма</th>
            <th>Кешбек</th>
            <th></th>
          </tr>
        </thead>
        <tbody id="tbody"></tbody>
      </table>
    </div>
    <div class="empty" id="emptyState" style="display:none;">Пока пусто. Добавь первую запись выше.</div>
  </div>
</div>
<div class="toast" hidden id="toast"></div>

<nav class="ios-tab-bar">
  <a href="index.html" class="ios-tab-item active">
    <span class="tab-icon">📝</span>
    <span>Ввод</span>
  </a>
  <a href="cashback.html" class="ios-tab-item">
    <span class="tab-icon">💳</span>
    <span>Кешбек</span>
  </a>
  <a href="analytics.html" class="ios-tab-item">
    <span class="tab-icon">📊</span>
    <span>Итоги</span>
  </a>
  <a href="settings.html" class="ios-tab-item">
    <span class="tab-icon">⚙️</span>
    <span>Настройки</span>
  </a>
</nav>

<script>
const STORAGE_KEY = 'finance-entries-all';
const CASHBACK_PLAN_KEY = 'finance-cashback-plans';
const CATEGORY_LIST_KEY = 'finance-categories';
const BANK_LABELS_KEY = 'finance-bank-labels';
const TEMPLATES_KEY = 'finance-quick-templates';

let entries = [], cashbackPlans = {}, categoryList = [], bankLabels = {}, quickTemplates = [];
let currentType = 'expense';
const $ = id => document.getElementById(id);

function parseNum(str){
  if(str === null || str === undefined) return NaN;
  const t = String(str).replace(/[\s\u00a0\u202f]/g, '').replace(',', '.');
  if(!/^-?(\d+\.?\d*|\.\d+)$/.test(t)) return NaN;
  return parseFloat(t);
}
function fmt(n){
  let v = Math.round(n*100)/100;
  if(v === 0) v = 0;
  return new Intl.NumberFormat('ru-RU', {minimumFractionDigits:2, maximumFractionDigits:2}).format(v) + ' ₽';
}
function ymd(d){
  return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0');
}
function newId(){ return Date.now().toString(36) + Math.random().toString(36).slice(2,6); }
function escapeHtml(str){ const d = document.createElement('div'); d.textContent = str; return d.innerHTML; }
function escapeAttr(str){ return escapeHtml(str).replace(/"/g, '&quot;'); }

function loadAllData(){
  try{ entries = JSON.parse(localStorage.getItem(STORAGE_KEY) || '[]'); }catch(e){ entries = []; }
  try{ cashbackPlans = JSON.parse(localStorage.getItem(CASHBACK_PLAN_KEY) || '{}'); }catch(e){ cashbackPlans = {}; }
  try{ categoryList = JSON.parse(localStorage.getItem(CATEGORY_LIST_KEY) || '[]'); }catch(e){ categoryList = []; }
  try{ bankLabels = JSON.parse(localStorage.getItem(BANK_LABELS_KEY) || '{}'); }catch(e){ bankLabels = {}; }
  try{ quickTemplates = JSON.parse(localStorage.getItem(TEMPLATES_KEY) || '[]'); }catch(e){ quickTemplates = []; }
  if(!categoryList.length) categoryList = [
    {name:'Продукты', emoji:'🛒'},{name:'Фастфуд', emoji:'🍔'},{name:'Доставка', emoji:'📦'},
    {name:'Транспорт', emoji:'🚌'},{name:'Ж/д билеты', emoji:'🚃'},{name:'Работа', emoji:'💼'},
    {name:'Ежемесячные', emoji:'🏠'},{name:'Здоровье', emoji:'❤️‍🩹'},{name:'Красота', emoji:'💅'},
    {name:'Одежда', emoji:'👕'},{name:'Электроника', emoji:'⚡️'},{name:'Товары для дома', emoji:'🧹'},
    {name:'Другое', emoji:'🎲'},{name:'Развлечения', emoji:'👾'},{name:'Цветы', emoji:'💐'}
  ];
}
function saveEntries(){ localStorage.setItem(STORAGE_KEY, JSON.stringify(entries)); }

const IOS_BANK_LINKS = [
  { name: 'Т-Банк', match: /тиньк|т-банк|t-bank|tinkoff/i, url: 'tinkoffbank://', color: '#ffdd2d' },
  { name: 'Сбер', match: /сбер|sber/i, url: 'sberbankonline://', color: '#21a038' },
  { name: 'Альфабанк', match: /альфа|alfa/i, url: 'alfabank://', color: '#ef3124' },
  { name: 'ВТБ', match: /втб|vtb/i, url: 'vtb://', color: '#009fdf' },
  { name: 'Озон', match: /озон|ozon/i, url: 'ozon://', color: '#005bff' },
  { name: 'Яндекс', match: /яндекс|yandex/i, url: 'yandexpay://', color: '#fc3f1d' }
];

function allKnownBanks(){
  const set = new Set([...entries.map(e=>e.bank), ...Object.keys(bankLabels)].filter(Boolean));
  return [...set].sort();
}

function renderIosBankBar(){
  const bar = $('iosBankBar'); if(!bar) return;
  const known = allKnownBanks();
  const list = []; const used = new Set();
  known.forEach(bName => {
    const info = IOS_BANK_LINKS.find(b => b.match.test(bName));
    if(info && !used.has(info.name)){ used.add(info.name); list.push({ label: bankLabels[bName] || bName, url: info.url, color: info.color, bank: bName }); }
  });
  IOS_BANK_LINKS.forEach(info => {
    if(!used.has(info.name)){ used.add(info.name); list.push({ label: info.name, url: info.url, color: info.color, bank: info.name }); }
  });
  bar.innerHTML = `<span style="font-size:0.72rem;color:var(--muted);white-space:nowrap;padding-right:4px;font-weight:700;">📱 Банки:</span>` +
    list.map(item => `<a class="ios-bank-pill" href="${escapeAttr(item.url)}" data-select-bank="${escapeAttr(item.bank)}"><span class="dot" style="background:${item.color}"></span><span>${escapeHtml(item.label)}</span> <span style="opacity:0.6;">↗</span></a>`).join('');
}

$('iosBankBar').addEventListener('click', (ev)=>{
  const pill = ev.target.closest('.ios-bank-pill'); if(!pill) return;
  const b = pill.dataset.selectBank;
  if(b){ $('f-bank').value = b; $('f-bank').dispatchEvent(new Event('input')); autoCalculateCashback(); }
});

function updateCategorySelect(){
  const sel = $('f-category'); const cur = sel.value;
  sel.innerHTML = categoryList.map(c=>`<option value="${escapeAttr(c.name)}">${c.emoji} ${escapeHtml(c.name)}</option>`).join('');
  if(categoryNames().includes(cur)) sel.value = cur;
}
function categoryNames(){ return categoryList.map(c=>c.name); }

function updateBankChips(){
  const list = allKnownBanks().slice(0, 8);
  const cur = $('f-bank').value;
  $('bankChips').innerHTML = list.map(b=>`<span class="bank-chip ${b===cur?'active':''}" data-bank="${escapeAttr(b)}">${escapeHtml(bankLabels[b]||b)}</span>`).join('');
}
$('bankChips').addEventListener('click', ev=>{
  const chip = ev.target.closest('.bank-chip'); if(!chip) return;
  $('f-bank').value = chip.dataset.bank;
  updateBankChips(); autoCalculateCashback(false);
});
$('f-bank').addEventListener('input', updateBankChips);

let userEditedCashbackManually = false;
$('f-cashback').addEventListener('input', ()=>{ userEditedCashbackManually = $('f-cashback').value.trim() !== ''; });

function currentMonthKey(){
  const d = new Date($('f-date').value || new Date());
  return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0');
}
function getRateForBankAndCat(bankName, catName){
  if(!bankName) return 0;
  const plan = cashbackPlans[currentMonthKey()] || [];
  const found = plan.find(b => (b.bank||'').trim().toLowerCase() === bankName.trim().toLowerCase());
  if(!found) return 0;
  if(catName && found.rates && found.rates[catName] !== undefined) return Number(found.rates[catName]) || 0;
  return Number(found.base) || 0;
}
function autoCalculateCashback(force){
  if(currentType !== 'expense') return;
  const bank = $('f-bank').value.trim();
  const cat = $('f-category').value;
  const amount = parseNum($('f-amount').value);
  const pct = getRateForBankAndCat(bank, cat);
  $('autoCbBadge').textContent = pct > 0 ? `тариф: ${pct}%` : 'тариф: 0%';
  if((!userEditedCashbackManually || force) && !isNaN(amount) && amount > 0 && pct > 0){
    const cb = Math.round(amount * (pct / 100) * 100) / 100;
    $('f-cashback').value = String(cb).replace('.', ',');
  }
}
['f-amount', 'f-bank', 'f-date'].forEach(id => $(id).addEventListener('input', ()=>autoCalculateCashback(false)));

function renderTemplates(){
  const wrap = $('tplChipsWrap'); if(!wrap) return;
  if(!quickTemplates.length){ wrap.innerHTML = '<span style="font-size:0.75rem;color:var(--muted);">Нет шаблонов. Нажми «⚡ Шаблон».</span>'; return; }
  wrap.innerHTML = quickTemplates.map((t, i)=>`<span class="tpl-chip" data-tpl-idx="${i}" style="background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:4px 10px;font-size:0.75rem;cursor:pointer;font-weight:600;">${escapeHtml(t.desc)} ${t.amount?t.amount+'₽':''} <span style="color:var(--red);cursor:pointer;" data-del="${i}">✕</span></span>`).join('');
}
$('tplChipsWrap').addEventListener('click', ev=>{
  const del = ev.target.closest('[data-del]');
  if(del){ quickTemplates.splice(Number(del.dataset.del), 1); localStorage.setItem(TEMPLATES_KEY, JSON.stringify(quickTemplates)); renderTemplates(); return; }
  const chip = ev.target.closest('[data-tpl-idx]'); if(!chip) return;
  const t = quickTemplates[Number(chip.dataset.tplIdx)];
  if(!t) return;
  $('f-desc').value = t.desc || '';
  if(t.cat) $('f-category').value = t.cat;
  if(t.bank) $('f-bank').value = t.bank;
  if(t.amount) $('f-amount').value = t.amount;
  updateBankChips(); autoCalculateCashback(true);
  if(t.amount) $('entryForm').requestSubmit();
});
$('saveAsTplBtn').addEventListener('click', ()=>{
  const desc = $('f-desc').value.trim();
  if(!desc) return;
  quickTemplates.push({ desc, amount: $('f-amount').value.trim(), cat: $('f-category').value, bank: $('f-bank').value.trim() });
  localStorage.setItem(TEMPLATES_KEY, JSON.stringify(quickTemplates));
  renderTemplates();
  showToast('Шаблон сохранен ✓');
});

function guessCat(desc){
  const l = desc.toLowerCase();
  if(/кофе|бургер|мак|обед|шаурм|пицц|кафе|kfc|додо/i.test(l)) return 'Фастфуд';
  if(/пятерочк|магнит|лента|ашан|вкусвилл|продукт|молок|хлеб/i.test(l)) return 'Продукты';
  if(/такси|метро|автобус|бензин|азс|проезд/i.test(l)) return 'Транспорт';
  return $('f-category').value;
}
function handleQuick(){
  const val = $('smartQuickInput').value.trim(); if(!val) return;
  let tokens = val.split(/\s+/); let amount = NaN;
  for(let i=0; i<tokens.length; i++){ const n = parseNum(tokens[i]); if(!isNaN(n) && n>0){ amount = n; tokens.splice(i,1); break; } }
  let bank = ''; const known = allKnownBanks();
  for(let i=tokens.length-1; i>=0; i--){
    const m = known.find(b => b.toLowerCase().startsWith(tokens[i].toLowerCase()));
    if(m){ bank = m; tokens.splice(i,1); break; }
  }
  const desc = tokens.join(' ') || 'Покупка';
  const cat = guessCat(desc);
  $('f-desc').value = desc; $('f-category').value = cat;
  if(bank) $('f-bank').value = bank;
  if(!isNaN(amount)) $('f-amount').value = String(amount).replace('.', ',');
  updateBankChips(); autoCalculateCashback(true);
  $('smartQuickInput').value = '';
  $('entryForm').requestSubmit();
}
$('smartQuickBtn').addEventListener('click', handleQuick);
$('smartQuickInput').addEventListener('keydown', e => { if(e.key==='Enter'){ e.preventDefault(); handleQuick(); } });

$('entryForm').addEventListener('submit', e=>{
  e.preventDefault();
  const date = $('f-date').value;
  const desc = $('f-desc').value.trim();
  const amount = parseNum($('f-amount').value);
  const bank = $('f-bank').value.trim();
  const isExp = currentType === 'expense';
  const cashback = isExp ? (parseNum($('f-cashback').value) || 0) : undefined;
  const category = isExp ? $('f-category').value : undefined;

  if(!date || !desc || isNaN(amount) || amount<=0) return;
  entries.push({ id: newId(), type: currentType, date, desc, amount, bank, cashback, category });
  saveEntries();
  renderTable();
  $('entryForm').reset();
  $('f-date').value = ymd(new Date());
  updateBankChips();
  showToast('Добавлено ✓');
});

function renderTable(){
  const tbody = $('tbody');
  const q = $('historySearch').value.trim().toLowerCase();
  const fBank = $('historyBankFilter').value;
  const fCat = $('historyCatFilter').value;

  const banks = [...new Set(entries.map(e=>e.bank).filter(Boolean))].sort();
  const cats = [...new Set(entries.map(e=>e.category).filter(Boolean))].sort();
  $('historyBankFilter').innerHTML = '<option value="">Все банки</option>' + banks.map(b=>`<option value="${escapeAttr(b)}" ${b===fBank?'selected':''}>${escapeHtml(b)}</option>`).join('');
  $('historyCatFilter').innerHTML = '<option value="">Все категории</option>' + cats.map(c=>`<option value="${escapeAttr(c)}" ${c===fCat?'selected':''}>${escapeHtml(c)}</option>`).join('');

  const filtered = [...entries].reverse().filter(e=>{
    if(fBank && e.bank !== fBank) return false;
    if(fCat && e.category !== fCat) return false;
    if(q && !`${e.desc} ${e.category} ${e.bank} ${e.amount}`.toLowerCase().includes(q)) return false;
    return true;
  });

  $('historyFilterCount').textContent = `Всего: ${entries.length}`;
  if(!filtered.length){ tbody.innerHTML = ''; $('emptyState').style.display='block'; return; }
  $('emptyState').style.display='none';

  tbody.innerHTML = filtered.map(e=>{
    const d = new Date(e.date+'T00:00:00').toLocaleDateString('ru-RU',{day:'2-digit',month:'2-digit'});
    const isExp = e.type==='expense';
    return `<tr>
      <td>${d}</td>
      <td>${escapeHtml(e.desc)}</td>
      <td>${e.category?escapeHtml(e.category):'—'}</td>
      <td><span class="bank-tag">${escapeHtml(e.bank||'')}</span></td>
      <td class="${isExp?'amt-expense':'amt-income'}">${isExp?'−':'+'}${fmt(e.amount)}</td>
      <td class="cb">${e.cashback?'+'+fmt(e.cashback):'—'}</td>
      <td><button style="background:none;border:none;color:var(--muted);cursor:pointer;font-size:1rem;" data-del="${e.id}">✕</button></td>
    </tr>`;
  }).join('');
}

$('tbody').addEventListener('click', e=>{
  const btn = e.target.closest('[data-del]'); if(!btn) return;
  entries = entries.filter(x=>x.id !== btn.dataset.del);
  saveEntries(); renderTable(); showToast('Удалено');
});
['historySearch','historyBankFilter','historyCatFilter'].forEach(id=>$(id).addEventListener('input', renderTable));
['historyBankFilter','historyCatFilter'].forEach(id=>$(id).addEventListener('change', renderTable));

function showToast(m){ const t = $('toast'); t.innerHTML = '<span>'+escapeHtml(m)+'</span>'; t.hidden=false; setTimeout(()=>t.hidden=true, 3000); }

document.querySelectorAll('.type-toggle button').forEach(b=>b.addEventListener('click', ()=>{
  document.querySelectorAll('.type-toggle button').forEach(x=>x.classList.remove('active'));
  b.classList.add('active'); currentType = b.dataset.type;
  $('cashbackField').style.display = currentType==='income'?'none':'block';
  $('categoryField').style.display = currentType==='income'?'none':'block';
}));

$('f-date').value = ymd(new Date());
$('f-date-text').value = new Date().toLocaleDateString();
loadAllData(); updateCategorySelect(); updateBankChips(); renderTemplates(); renderTable(); renderIosBankBar();
</script>
</body>
</html>
